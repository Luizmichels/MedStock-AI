# Produção (EC2): banco, API, frontend, roteador interno (Caddy) e Cloudflare Tunnel.
#
# Uso, na raiz do repositório e com o .env de produção criado a partir de
# deploy/env.producao.example:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nenhum serviço publica porta. O acesso da internet entra só pelo túnel: o
# container `tunnel` abre uma conexão de SAÍDA até a Cloudflare (que faz o
# HTTPS) e entrega as requisições ao Caddy, que roteia por host.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: medstock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AMBIENTE: producao
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/medstock
      FRONTEND_URL: https://app.${DOMINIO:?defina DOMINIO no .env}
      # A API só é alcançada pelo Caddy (via túnel); confiar no X-Forwarded-For
      # faz o rate limit enxergar o IP real do usuário em vez do IP do proxy.
      FORWARDED_ALLOW_IPS: "*"
      # O .env traz o token do túnel; a API não precisa dele.
      CLOUDFLARE_TUNNEL_TOKEN: ""
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        # Embutida no build do Next (variável NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_URL: https://api.${DOMINIO}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      LIMITE_UPLOAD_PROXY: ${LIMITE_UPLOAD_PROXY:-60MB}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

  # Cloudflare Tunnel: os endereços públicos (app., api., raiz e www) são
  # configurados no painel da Cloudflare apontando para http://proxy:80.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?defina CLOUDFLARE_TUNNEL_TOKEN no .env}
    depends_on:
      - proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
