# Análise do SonarQube Cloud, executada pelo job "sonar" do ci.yml.
# A análise automática do painel fica desligada: ela não recebe a cobertura.
sonar.organization=luizmichels
sonar.projectKey=Luizmichels_MedStock-AI
sonar.projectName=MedStock-AI

# Os testes do frontend ficam ao lado do código (*.test.ts[x]) e em src/test/:
# saem das fontes e entram como testes.
sonar.sources=Backend/app,Frontend/src
sonar.exclusions=Frontend/src/**/*.test.ts,Frontend/src/**/*.test.tsx,Frontend/src/test/**
sonar.tests=Backend/tests,Frontend/src
sonar.test.inclusions=Backend/tests/**,Frontend/src/**/*.test.ts,Frontend/src/**/*.test.tsx,Frontend/src/test/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Relatórios gerados pelos jobs "backend" e "frontend" e baixados como
# artefatos antes da análise.
sonar.python.coverage.reportPaths=Backend/coverage.xml
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
