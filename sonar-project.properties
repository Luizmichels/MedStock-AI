# Análise do SonarQube Cloud, executada pelo job "sonar" do ci.yml.
# A análise automática do painel fica desligada: ela não recebe a cobertura.
sonar.organization=luizmichels
sonar.projectKey=Luizmichels_MedStock-AI
sonar.projectName=MedStock-AI

sonar.sources=Backend/app,Frontend/src
sonar.tests=Backend/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Relatório gerado pelo job "backend" e baixado como artefato antes da análise.
sonar.python.coverage.reportPaths=Backend/coverage.xml

# O frontend não tem testes automatizados: a cobertura medida é a do backend.
# Sem esta linha, o quality gate reprovaria toda PR que mexesse no frontend.
sonar.coverage.exclusions=Frontend/**
