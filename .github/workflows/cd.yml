name: CD

# A cada merge na main: roda o CI completo e, se passar, publica as imagens da
# API e do frontend no GitHub Container Registry (GHCR). O servidor não recebe
# nada daqui: o deploy/atualizar.sh, agendado no cron da EC2, percebe a imagem
# nova, faz backup, troca os containers, confere a saúde e volta à versão
# anterior se algo falhar.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # O GHCR exige o nome em minúsculas.
  REGISTRO: ghcr.io/luizmichels

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  imagens:
    name: Imagem ${{ matrix.servico }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servico: api
            contexto: Backend
          - servico: frontend
            contexto: Frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest (o que o servidor acompanha) e sha-<commit> (para voltar a uma
      # versão específica com TAG_IMAGEM no .env do servidor).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRO }}/medstock-ai-${{ matrix.servico }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Só o frontend usa: a URL da API é embutida no build do Next.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMINIO || 'medstock.com.br' }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
