name: CD

# A cada merge na main: roda o CI completo e, se passar, publica as imagens da
# API e do frontend no GitHub Container Registry (GHCR). O servidor não recebe
# nada daqui: o deploy/atualizar.sh, agendado no cron da EC2, percebe a imagem
# nova, faz backup, troca os containers, confere a saúde e volta à versão
# anterior se algo falhar.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # O GHCR exige o nome em minúsculas.
  REGISTRO: ghcr.io/luizmichels

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Repassa o SONAR_TOKEN ao CI; sem isso o job do Sonar não roda na main.
    secrets: inherit

  imagens:
    name: Imagem ${{ matrix.servico }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servico: api
            contexto: Backend
          - servico: frontend
            contexto: Frontend
    steps:
      - uses: actions/checkout@v7

      # Actions de terceiros fixadas pelo SHA do commit (uma tag pode ser
      # movida para outro código); o comentário indica a versão.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest (o que o servidor acompanha) e sha-<commit> (para voltar a uma
      # versão específica com TAG_IMAGEM no .env do servidor).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRO }}/medstock-ai-${{ matrix.servico }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Mesmo valor da tag sha-<7 caracteres> acima.
      - id: versao
        run: echo "valor=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_API_URL: só o frontend usa (embutida no build do Next).
          # VERSAO: só a API usa (vai em cada linha de log).
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMINIO || 'medstock.com.br' }}
            VERSAO=${{ steps.versao.outputs.valor }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
